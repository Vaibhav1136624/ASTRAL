name: Build Android preview
on:
  push:
    tags: ['android-preview-*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node tests/verify.cjs && node tests/verify-cosmos.cjs && node tests/verify-animations.cjs
      - run: npx --no-install cap sync android
      - run: bash gradlew --no-daemon :app:assembleDebug
        working-directory: android
      - name: Verify installation package
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ASTRAL.apk
          buildtools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$buildtools/apksigner" verify --verbose ASTRAL.apk
          "$buildtools/aapt" dump badging ASTRAL.apk | grep -F "package: name='com.astralgame.puzzle'"
          unzip -tq ASTRAL.apk
          unzip -Z1 ASTRAL.apk | grep -Fx assets/public/game/spectral-layouts.js
          sha256sum ASTRAL.apk > ASTRAL.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: astral-android-preview
          path: |
            ASTRAL.apk
            ASTRAL.apk.sha256
      - name: Publish verified preview
        if: startsWith(github.ref, 'refs/tags/android-preview-')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" ASTRAL.apk ASTRAL.apk.sha256 --verify-tag --prerelease --title "ASTRAL for Android — preview" --notes "Installable preview for Android 7.0 and later. All 101 chambers are bundled for offline play. This APK is debug-signed for testing, not a Google Play release. A later build signed with another key will require uninstalling this preview, which can remove local progress."
